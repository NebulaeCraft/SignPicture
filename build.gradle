plugins {
	id 'java'
}

allprojects {
	project.metaClass {
		isProperty = { propName ->
			delegate.hasProperty(propName) && !delegate.property(propName).empty
		}
	}
}

ext {
	assert project.isProperty('version_major'): 'missing property: version_major'
	assert project.isProperty('version_minor'): 'missing property: version_minor'
	assert project.isProperty('version_patch'): 'missing property: version_patch'

	def buildnumberfile = file('.buildnumber/buildnum.properties')
	def buildnumber = 1
	def props = new Properties()
	if (buildnumberfile.exists()) {
		buildnumberfile.withInputStream { props.load(it) }
		if (props.buildnumber &&
				props.version_major == project.version_major &&
				props.version_minor == project.version_minor &&
				props.version_patch == project.version_patch) {
			buildnumber = props.buildnumber as Integer
		}
	}

	mod_version_min = "${project.version_major}.${project.version_minor}.${project.version_patch}"
	mod_version = mod_version_min
	mod_version_full = "${mod_version_min}+${String.format('%03d', buildnumber)}"
	mod_artifacts_dir = file("artifacts/${mod_version_min}/${mod_version_full}")

	task increment {
		doLast {
			def next = new Properties()
			next.version_major = project.version_major
			next.version_minor = project.version_minor
			next.version_patch = project.version_patch
			next.buildnumber = (buildnumber + 1) as String
			buildnumberfile.parentFile.mkdirs()
			buildnumberfile.withOutputStream { next.store(it, 'Build Number Property') }
		}
	}

}

evaluationDependsOnChildren()

sourceSets {
	all {
		java.srcDirs = []
		resources.srcDirs = []
	}
}

version = mod_version

jar {
	subprojects.each { p ->
		manifest p.commonManifest
		p.tasks.shadowJar.outputs.files.each { f -> from zipTree(f) }
		dependsOn p.tasks.reobfShadowJar
	}
	dependsOn increment
	destinationDir = mod_artifacts_dir
}

artifacts {
	archives jar
}
